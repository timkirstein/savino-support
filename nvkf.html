  <script>
    // Landing stub for the NVKF Christmas-dinner QR code. The QR points at

    // installed opens the APP instead of the web checkout, where the promo
    // code (NVKF30) can't be applied. savino.no is not claimed by the app, so
    // this page loads in the browser and forwards to the web checkout.
    window.location.replace("https://app.savino.no/nvkf?promo=NVKF30");
  </script>
