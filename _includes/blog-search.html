<div class="blog-search" role="search">
  <input id="blog-search-input" class="blog-search-input" type="search" placeholder="Søk i artiklene, f.eks. lam, trøffel, dessert …"
         aria-label="Søk i bloggen" autocomplete="off" enterkeyhint="search"
         data-one="1 treff" data-many="{n} treff">
  <button type="button" class="blog-search-clear" id="blog-search-clear" aria-label="Tøm søket" hidden>&times;</button>
  <p class="blog-search-status" id="blog-search-status" aria-live="polite"></p>
</div>
<p class="blog-search-empty" id="blog-search-empty" hidden>Ingen artikler matchet søket ditt.</p>
<script src="/assets/js/blog-search.js" defer></script>
